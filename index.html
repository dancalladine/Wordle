<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>WORDLE<span>BLUE</span></h1>
    <div class="header-actions">
      <button id="stats-btn" type="button">Stats</button>
      <button id="new-game-btn" type="button">New Game</button>
    </div>
  </header>

  <div id="toast-container" aria-live="polite"></div>

  <main>
    <div id="board" role="grid" aria-label="Guess grid"></div>
    <div id="status-banner" class="hidden" role="status"></div>
  </main>

  <footer>
    <div id="keyboard" role="group" aria-label="On-screen keyboard"></div>
  </footer>

  <div id="stats-modal-backdrop" class="hidden">
    <div id="stats-modal" role="dialog" aria-label="Statistics" aria-modal="true">
      <button id="stats-close-btn" type="button" aria-label="Close statistics">&times;</button>
      <h2>Statistics</h2>
      <div class="stats-summary">
        <div class="stat">
          <div class="stat-value" id="stat-played">0</div>
          <div class="stat-label">Played</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-win-pct">0</div>
          <div class="stat-label">Win %</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-streak">0</div>
          <div class="stat-label">Current Streak</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-max-streak">0</div>
          <div class="stat-label">Max Streak</div>
        </div>
      </div>
      <h3>Guess Distribution</h3>
      <div id="stats-distribution"></div>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="script.js"></script>
</body>
</html>
