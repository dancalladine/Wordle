<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>WORDLE<span>BLUE</span></h1>
    <button id="new-game-btn" type="button">New Game</button>
  </header>

  <div id="toast-container" aria-live="polite"></div>

  <main>
    <div id="board" role="grid" aria-label="Guess grid"></div>
    <div id="status-banner" class="hidden" role="status"></div>
  </main>

  <footer>
    <div id="keyboard" role="group" aria-label="On-screen keyboard"></div>
  </footer>

  <script src="words.js"></script>
  <script src="script.js"></script>
</body>
</html>
